<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسویه حساب | Mohammad Hossein Alikahi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container">
    <nav>
      <a class="logo" href="index.html#about">MHA</a>
      <div class="menu">
        <a href="products.html">بازگشت به فروشگاه</a>
      </div>
    </nav>
  </div>
</header>

<section>
  <div class="container checkout-container">
    <div class="checkout-card">
      <h2 class="section-title" style="margin-bottom: 30px;">سبد خرید و تسویه حساب</h2>
      
      <!-- خلاصه تمام محصولات انتخابی -->
      <div id="checkout-summary" class="checkout-summary"></div>

      <!-- پیام خطا -->
      <div id="form-error" class="form-error" style="display: none;"></div>

      <form id="checkout-form" class="checkout-form" novalidate>
        <div class="form-group">
          <label>نام و نام خانوادگی <span class="required-star">*</span></label>
          <input type="text" id="fullname" placeholder="مثال: محمدحسین علی‌کاهی">
        </div>
        <div class="form-group">
          <label>شماره تماس <span class="required-star">*</span></label>
          <input type="tel" id="phone" placeholder="۰۹۱۲۰۰۰۰۰۰۰">
        </div>
        <div class="form-group">
          <label>ایمیل <span class="required-star">*</span></label>
          <input type="email" id="email" placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label>کد پستی <span class="required-star">*</span></label>
          <input type="text" id="postal">
        </div>
        <div class="form-group">
          <label>آدرس دقیق <span class="required-star">*</span></label>
          <textarea id="address" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>توضیحات سفارش (اختیاری)</label>
          <textarea id="notes" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-success">ثبت نهایی سفارش</button>
      </form>
    </div>
  </div>
</section>

<script src="shop.js"></script>
</body>
</html>
