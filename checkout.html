<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Mohammad Hossein Alikahi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container">
    <nav>
      <a class="logo" href="index.html#about">MHA</a>
      <div class="menu">
        <a href="products.html">بازگشت به فروشگاه</a>
      </div>
    </nav>
  </div>
</header>

<section>
  <div class="container checkout-container">
    <div class="card checkout-card">
      <h2 class="section-title">خلاصه سفارش</h2>
      
      <div id="checkout-summary" class="checkout-summary">
        <!-- محصول انتخاب شده اینجا لود میشه -->
      </div>

      <form id="checkout-form" class="checkout-form">
        <div class="form-group">
          <label>نام و نام خانوادگی *</label>
          <input type="text" id="fullname" required>
        </div>
        <div class="form-group">
          <label>شماره تماس *</label>
          <input type="tel" id="phone" required>
        </div>
        <div class="form-group">
          <label>ایمیل *</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>کد پستی *</label>
          <input type="text" id="postal" required>
        </div>
        <div class="form-group">
          <label>آدرس دقیق *</label>
          <textarea id="address" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label>توضیحات (اختیاری)</label>
          <textarea id="notes" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-success btn-large">ثبت نهایی سفارش</button>
      </form>
    </div>
  </div>
</section>

<script src="shop.js"></script>
</body>
</html>
