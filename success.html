<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت موفق سفارش | Mohammad Hossein Alikahi</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="success-page">

<header style="width: 100%;">
  <div class="container">
    <nav>
      <a class="logo" href="index.html#about">MHA</a>
      <div class="menu">
        <a href="index.html">صفحه اصلی</a>
        <a href="products.html">فروشگاه</a>
      </div>
    </nav>
  </div>
</header>

<section class="success-section">
  <div class="container success-wrapper">
    <div class="card success-card">
      <!-- آیکون تیک مدرن و اختصاصی -->
      <div class="success-icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>

      <h2 class="success-title">سفارش با موفقیت ثبت شد</h2>
      <p class="success-desc">اطلاعات شما ثبت شد و سفارش جهت پردازش برای ما ارسال گردید.</p>

      <!-- باکس نمایش کد پیگیری -->
      <div style="background: rgba(255, 255, 255, 0.05); border: 2px dashed #00ff88; padding: 18px; border-radius: 12px; margin: 25px 0; text-align: center;">
        <p style="margin: 0 0 8px 0; color: #a0aec0; font-size: 0.95rem;">شماره پیگیری سفارش شما:</p>
        <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
          <span id="order-id" style="font-weight: bold; font-size: 1.4rem; letter-spacing: 2px; color: #00ff88;">در حال دریافت...</span>
          <button onclick="copyOrderId()" style="background: #00ff88; color: #111; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold;">کپی</button>
        </div>
      </div>

      <p style="font-size: 0.9rem; color: #cbd5e0; margin-bottom: 20px;">
        برای سوال یا پیگیری سریع‌تر، کد بالا را به 
        <a href="https://t.me/mhalikahi" target="_blank" style="color: #00ff88; font-weight: bold; text-decoration: underline;">پشتیبانی تلگرام</a> 
        ارسال کنید.
      </p>

      <a href="index.html" class="btn btn-cart btn-large" style="margin-top: 10px;">
        بازگشت به صفحه اصلی
      </a>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <h3>Mohammad Hossein Alikahi</h3>
    <p>© 2026 All Rights Reserved.</p>
  </div>
</footer>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const lastOrder = JSON.parse(localStorage.getItem('lastOrder'));
    const orderElem = document.getElementById('order-id');
    
    if (lastOrder && lastOrder.orderId) {
      orderElem.innerText = lastOrder.orderId;
    } else {
      orderElem.innerText = 'ثبت نشده';
    }
  });

  function copyOrderId() {
    const code = document.getElementById('order-id').innerText;
    if (code && code !== 'در حال دریافت...' && code !== 'ثبت نشده') {
      navigator.clipboard.writeText(code).then(() => {
        alert('کد پیگیری کپی شد!');
      });
    }
  }
</script>

</body>
</html>
